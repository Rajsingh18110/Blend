[project]
name = "blend-search"
version = "0.1.0"
description = "Blend — privacy-first multi-engine search, by MarkanM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "MarkanM"}]
dependencies = [
    "flask==3.1.3",
    "flask-cors>=4.0",
    "flask-babel==4.0.0",
    "gunicorn>=22.0",
    "crawl4ai",
    "yt-dlp>=2024.12.13",
    "openai",
    "anthropic",
    "google-genai",
    "g4f",
    "platformdirs",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pyyaml",
    "typer<0.13",
    "whitenoise",
    "msgspec",
    "aiohttp",
    "aiohttp-socks",
    "python-dotenv",
    "valkey",
    "PySocks",
    "httpx",
    "httpx-socks",
    "python-dateutil",
    "isodate",
    "markdown-it-py",
    "bleach",
    "packaging",
    "cloudscraper",
    "typing_extensions"
]

[project.scripts]
blend = "blend.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
blend = ["templates/**/*", "static/**/*", "blend_core/data/*", "blend_core/*.yml", "blend_core/*.toml", "blend_core/assets/**/*", "blend_core/views/**/*", "blend_core/infopage/**/*", "blend_core/translations/**/*", "blend_core/botdetection/**/*"]
